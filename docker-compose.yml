name: meridiani

services:
  # Baza za razvoj. Backend in frontend pridejo sem v ločenem ticketu za dockerizacijo.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridiani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridiani}
      POSTGRES_DB: ${POSTGRES_DB:-meridiani}
    ports:
      # 5432 je pogosto že zaseden z lokalno namestitvijo PostgreSQL
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
